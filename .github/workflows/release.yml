name: release

# Pushing a version tag (v1.2.3) runs the tests, then publishes to npm with
# provenance (the npm page shows it was built here, from this commit) and
# creates the GitHub release with the notes from CHANGELOG.md.
# How to make a release: docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Tests, Windows, Node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (no stored token) needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - name: Check the tag, versions and changelog
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME" release-notes.md

      - name: Check what goes into the package
        run: npm pack --dry-run

      - name: Publish
        # With trusted publishing set up on npmjs.com, no token is needed.
        # Otherwise the NPM_TOKEN repository secret is used.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The MCP Registry (registry.modelcontextprotocol.io) lists server.json.
      # It checks that the npm package's "mcpName" matches, and GitHub's OIDC
      # identity proves this repository owns io.github.necromancer124/*.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.16
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        # npm already has the release at this point: a registry problem must
        # not stop the GitHub release. It shows as a warning in the run.
        continue-on-error: true
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
