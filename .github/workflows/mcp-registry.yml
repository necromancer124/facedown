name: mcp-registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io). Called by release.yml after a release is
# on npm; can also be started by hand (Actions -> mcp-registry -> Run workflow)
# to publish the listing for the version on main again.
#
# The registry checks that the npm package's "mcpName" matches server.json, and
# GitHub's OIDC identity proves this repository owns io.github.necromancer124/*,
# so no token is stored anywhere.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@v4

      - name: Wait until npm shows this version
        # A version npm just accepted can take a few minutes to appear, and the
        # registry refuses to list a version it cannot see on npm.
        run: |
          version=$(node -p "require('./server.json').packages[0].version")
          for i in $(seq 1 30); do
            if npm view "facedown@$version" version >/dev/null 2>&1; then
              echo "facedown@$version is on npm"
              exit 0
            fi
            echo "waiting for facedown@$version on npm ($i/30)"
            sleep 20
          done
          echo "facedown@$version did not appear on npm within 10 minutes"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
